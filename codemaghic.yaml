workflows:
  troll-unsigned-ipa:
    name: TrollStore无签名IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: 拉取Swift包依赖
        script: |
          xcodebuild -resolvePackageDependencies -scheme CardKeeper -destination generic/platform=iOS
      - name: Archive归档（关闭签名）
        script: |
          xcodebuild archive \
          -scheme CardKeeper \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $CM_BUILD_DIR/app.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""
      - name: 导出无签名IPA
        script: |
          xcodebuild -exportArchive \
          -archivePath $CM_BUILD_DIR/app.xcarchive \
          -exportPath $CM_BUILD_DIR/output \
          -exportOptionsPlist <(echo '{
            "method": "app-store",
            "signingStyle": "manual",
            "provisioningProfiles": {}
          }')
    artifacts:
      - output/*.ipa
