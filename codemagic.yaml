# Codemagic 构建配置：编译出未签名 IPA（供 TrollStore 安装）
# 本文件必须放在 GitHub 仓库的【根目录】（和 .github 同级）
# 免费套餐每月 500 分钟，本构建一次约 5 分钟，无需 Apple 开发者账号

workflows:
  cardkeeper-ipa:
    name: 卡管家 · 未签名 IPA
    max_build_duration: 20

    # 每次 push 自动构建；也可以在 Codemagic 网页上手动 Start build
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    environment:
      xcode: latest

    scripts:
      # ---------- 1. 定位工程（自动兼容多套一层文件夹的情况） ----------
      - name: 定位 Xcode 工程
        script: |
          set -e
          PROJ="$(find . -maxdepth 4 -type d -name 'CardKeeper.xcodeproj' | head -n 1)"
          if [ -z "$PROJ" ]; then
            echo "❌ 找不到 CardKeeper.xcodeproj，当前仓库结构："
            find . -maxdepth 3 -not -path './.git/*' -print
            exit 1
          fi
          echo "✅ 工程：$PROJ"
          cd "$(dirname "$PROJ")"
          xcodebuild -version
          echo "--- 工程预检 ---"
          xcodebuild -list -project CardKeeper.xcodeproj

      # ---------- 2. 编译（Release / arm64 / 不签名） ----------
      - name: 编译未签名 App
        script: |
          set -o pipefail
          cd "$(dirname "$(find . -maxdepth 4 -type d -name 'CardKeeper.xcodeproj' | head -n 1)")"
          set +e
          xcodebuild \
            -project CardKeeper.xcodeproj \
            -scheme CardKeeper \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "=========== 编译失败，具体错误行（error:） ==========="
            grep -n "error:" xcodebuild.log | head -n 60 || echo "（日志中没有 error: 行）"
            echo "=========== 日志最后 60 行 ==========="
            tail -n 60 xcodebuild.log
            echo "======================================================"
            exit 1
          fi
          echo "✅ 编译成功"

      # ---------- 3. 打包成 IPA ----------
      - name: 打包 IPA
        script: |
          set -e
          cd "$(dirname "$(find . -maxdepth 4 -type d -name 'CardKeeper.xcodeproj' | head -n 1)")"
          APP="$(find build/Build/Products -type d -name 'CardKeeper.app' | head -n 1)"
          if [ -z "$APP" ]; then
            echo "❌ 未找到 CardKeeper.app，构建产物目录："
            find build/Build/Products -maxdepth 2 -print 2>/dev/null || true
            exit 1
          fi
          echo "--- 校验产物 ---"
          ls -la "$APP"
          file "$APP/CardKeeper"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          rm -rf Payload CardKeeper-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CardKeeper-unsigned.ipa Payload
          echo "✅ IPA 已生成，大小：$(du -h CardKeeper-unsigned.ipa | cut -f1)"

    # 构建成功后，在 Builds → 对应这次构建 → Artifacts 里下载
    artifacts:
      - '**/CardKeeper-unsigned.ipa'
      - '**/xcodebuild.log'
